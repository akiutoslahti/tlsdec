name: tlsdec CI
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: All-in-one CI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest

      - name: Type checker
        run: mypy --strict src

      - name: Check formatting
        run: ruff format --check

      - name: Lint sources
        run: ruff check
